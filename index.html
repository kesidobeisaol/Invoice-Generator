<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="app-bg">
    <main class="container form-container" id="formPage">
        <section class="card">
            <div class="form-header">
                <div>
                    <p class="eyebrow">Professional Invoice</p>
                    <h1>Invoice Generator</h1>
                    <p class="muted">Create a professional invoice with withholding tax and net amount computation.</p>
                </div>
            </div>

            <form id="invoiceForm">
                <h2>Freelancer / Business Information</h2>

                <div class="grid two">
                    <label>Freelancer / Business Name
                        <input type="text" name="freelancer_name" required placeholder="Your Name or Business Name">
                    </label>

                    <label>Email Address <span class="optional">optional</span>
                        <input type="email" name="freelancer_email" placeholder="your@email.com">
                    </label>

                    <label>Business Address <span class="optional">optional</span>
                        <input type="text" name="freelancer_address" placeholder="Street / Building / Unit">
                    </label>

                    <label>Phone Number <span class="optional">optional</span>
                        <input type="text" name="freelancer_phone" placeholder="+63...">
                    </label>

                    <label>City <span class="optional">optional</span>
                        <input type="text" name="freelancer_city" placeholder="City">
                    </label>

                    <label>Postal Code <span class="optional">optional</span>
                        <input type="text" name="freelancer_postal" placeholder="Postal Code">
                    </label>

                    <label>Country
                        <input type="text" name="freelancer_country" required placeholder="Country">
                    </label>
                </div>

                <h2>Client / Agency Information</h2>

                <div class="grid two">
                    <label>Bill To Company Name
                        <input type="text" name="client_name" required placeholder="Agency or Client Company">
                    </label>

                    <label>Contact Person <span class="optional">optional</span>
                        <input type="text" name="client_contact" placeholder="Contact Person">
                    </label>

                    <label>Address <span class="optional">optional</span>
                        <input type="text" name="client_address" placeholder="Street / Building / Unit">
                    </label>

                    <label>Email Address <span class="optional">optional</span>
                        <input type="email" name="client_email" placeholder="client@email.com">
                    </label>

                    <label>City <span class="optional">optional</span>
                        <input type="text" name="client_city" placeholder="City">
                    </label>

                    <label>Postal Code <span class="optional">optional</span>
                        <input type="text" name="client_postal" placeholder="Postal Code">
                    </label>

                    <label>Country
                        <input type="text" name="client_country" required placeholder="Country">
                    </label>
                </div>

                <h2>Invoice Information</h2>

                <div class="grid three">
                    <label>Invoice Date
                        <input type="date" name="invoice_date" id="invoiceDate" required>
                    </label>

                    <label>Hourly Rate
                        <input type="number" name="hourly_rate" min="0" step="0.01" required placeholder="Enter hourly rate">
                    </label>

                    <label>Currency
                        <input type="text" name="currency" required placeholder="e.g., PHP, USD" value="PHP">
                    </label>
                </div>

                <h2>Payment Information</h2>

                <div class="grid one">
                    <label>Bank QR Code / Payment Details <span class="optional">optional</span>
                        <textarea name="payment_qr" id="paymentQr" rows="4" placeholder="Paste bank QR code text, payment link, or image URL/data URL"></textarea>
                    </label>
                </div>

                <div class="section-title-row">
                    <h2>Task / Timesheet Details</h2>
                    <button type="button" class="btn secondary" id="addTaskBtn">+ Add Task Row</button>
                </div>

                <div class="task-table-wrap">
                    <table class="form-table" id="tasksTable">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Month</th>
                                <th>Day</th>
                                <th>Activity Details</th>
                                <th>Hours</th>
                                <th></th>
                            </tr>
                        </thead>

                        <tbody id="tasksBody">
                            <tr class="task-row">
                                <td><input type="text" name="tasks[0][date]" placeholder="e.g., Apr 13, 2026" required></td>
                                <td><input type="text" name="tasks[0][month]" placeholder="e.g., April" required></td>
                                <td><input type="number" name="tasks[0][day]" placeholder="13" required></td>
                                <td><textarea name="tasks[0][details]" rows="4" placeholder="Describe the task or activity performed..." required></textarea></td>
                                <td><input type="number" name="tasks[0][hours]" placeholder="0" min="0" step="0.25" required></td>
                                <td><button type="button" class="icon-btn remove-row" title="Remove row">×</button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="actions">
                    <button type="submit" class="btn primary">Preview Invoice</button>
                </div>
            </form>
        </section>
    </main>

    <main class="invoice-page" id="invoicePage" hidden>
        <div class="invoice-actions no-print">
            <button type="button" class="btn secondary" id="backToFormBtn">Back to Form</button>
            <button type="button" class="btn primary" id="printInvoiceBtn">Print / Save as PDF</button>
        </div>

        <section class="invoice-sheet" id="invoiceOutput"></section>
    </main>

    <script src="script.js"></script>
</body>
</html>
